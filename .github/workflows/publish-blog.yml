name: Publish Blog Post

on:
  schedule:
    # Every Monday at 8am Central (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Manual trigger from GitHub if needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next blog post
        run: node scripts/publish-post.js

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/blog/ public/blog-content/ public/sitemap.xml
          git commit -m "Publish weekly blog post"
          git push
